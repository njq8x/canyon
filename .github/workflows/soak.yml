name: Soak

# Long connection churn run: many parallel logins with idling and disconnects,
# on both networking stacks. Weekly plus manual runs, because it takes a few
# minutes and the short version already runs on every build.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  soak:
    name: Soak (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: legacy
            netty: '0'
            port: '25601'
          - stack: netty
            netty: '1'
            port: '25602'
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply patches
        run: ./canyon p

      - name: Build
        run: mvn -B clean package

      - name: Run soak test
        env:
          SOAK_NETTY: ${{ matrix.netty }}
          SOAK_PORT: ${{ matrix.port }}
          SOAK_IDLE_MS: '2000'
          SOAK_OUTPUT: soak-${{ matrix.stack }}.txt
        run: ./scripts/soak.sh Canyon-Server/target/canyon-server.jar Canyon-API/target/canyon-api.jar 4 4 16

      - name: Publish summary
        if: always()
        run: |
          file="soak-${{ matrix.stack }}.txt"
          if [ -f "$file" ]; then
            {
              echo "### Canyon soak test (${{ matrix.stack }})"
              echo
              echo '```'
              cat "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ matrix.stack }}
          path: soak-${{ matrix.stack }}.txt
          if-no-files-found: warn
          retention-days: 90
