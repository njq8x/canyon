name: Release

# Publishing is tag-driven: push a tag like v1.7.3 and this builds, verifies
# and attaches the jars to a GitHub release. This replaces the upstream
# Jenkins instance, which is no longer reachable (canyonmodded/canyon#73).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Configure git identity
        # ./canyon p applies patches with `git am`, which needs an identity.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply patches
        run: ./canyon p

      - name: Build
        run: mvn -B clean package

      - name: Smoke test
        run: ./scripts/smoke-test.sh Canyon-Server/target/canyon-server.jar Canyon-API/target/canyon-api.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          server="canyon-server-${GITHUB_REF_NAME}.jar"
          api="canyon-api-${GITHUB_REF_NAME}.jar"

          cp Canyon-Server/target/canyon-server.jar "$server"
          cp Canyon-API/target/canyon-api.jar "$api"
          sha256sum "$server" "$api" > SHA256SUMS

          gh release create "$GITHUB_REF_NAME" \
            "$server" "$api" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Canyon ${GITHUB_REF_NAME}" \
            --generate-notes
