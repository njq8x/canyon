name: Benchmark

# Weekly load benchmark, plus manual runs. This is deliberately not part of the
# pull request workflow: absolute numbers depend on the runner and are only
# useful for comparing builds on the same machine.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    name: Load benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply patches
        run: ./canyon p

      - name: Build
        run: mvn -B clean package

      - name: Run benchmark
        run: ./scripts/benchmark.sh Canyon-Server/target/canyon-server.jar Canyon-API/target/canyon-api.jar

      - name: Publish summary
        if: always()
        run: |
          if [ -f benchmark.txt ]; then
            {
              echo '### Canyon load benchmark'
              echo
              echo '```'
              cat benchmark.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark.txt
          if-no-files-found: warn
          retention-days: 90
